<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Bouquet Bloom</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(255,255,255,0.30);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: lowercase;
      user-select: none;
      pointer-events: none;
      opacity: 0;
      animation: showHint .8s ease 14s forwards;
      white-space: nowrap;
    }
    @keyframes showHint { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">tap to replay</div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const hint = document.querySelector('.hint');

    let W = 0, H = 0, DPR = 1;
    let startTime = performance.now();
    let stems = [];
    let flowers = [];
    let particles = [];

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    let rnd = mulberry32(20260820);
    const rand = (a, b) => a + (b - a) * rnd();
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function easeOutCubic(t) {
      t = clamp(t, 0, 1);
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutBack(t) {
      t = clamp(t, 0, 1);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const n = parseInt(full, 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function pointOnQuadratic(p0, cp, p1, t) {
      const u = 1 - t;
      return {
        x: u*u*p0.x + 2*u*t*cp.x + t*t*p1.x,
        y: u*u*p0.y + 2*u*t*cp.y + t*t*p1.y
      };
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildScene();
    }

    function buildScene() {
      stems = [];
      flowers = [];
      particles = [];
      rnd = mulberry32(20260820);

      const portrait = H >= W;
      const centerX = W * 0.5;
      const baseY = H * 1.01;
      const bouquetWidth = portrait ? W * 0.12 : W * 0.10;
      const mainCount = portrait ? 8 : 9;

      const flowerColors = ['#984746', '#f0ece3', '#c78ca6', '#c9b056'];
      const flowerTypes = ['rose', 'daisy', 'cup', 'simple5'];
      const tipPoints = [];

      // Main bouquet stems: shorter, tighter, more central.
      for (let i = 0; i < mainCount; i++) {
        const spread = (i / (mainCount - 1)) - 0.5;
        const baseX = centerX + spread * bouquetWidth + rand(-6, 6);

        const height = H * rand(0.22, 0.32); // shorter stems
        const tipSpread = portrait ? W * 0.14 : W * 0.12;
        const tipX = centerX + spread * tipSpread + rand(-18, 18);
        const tipY = H - height;

        const p0 = { x: baseX, y: baseY };
        const cp = {
          x: centerX + spread * W * rand(0.08, 0.16) + rand(-24, 24),
          y: H - height * rand(0.48, 0.66)
        };
        const p1 = { x: tipX, y: tipY };

        const width = rand(2.4, 4.2);
        const start = rand(0.2, 4.6);
        const duration = rand(2.0, 3.4);

        const leaves = [];
        const leafCount = 2 + Math.floor(rand(0, 2.99));
        for (let j = 0; j < leafCount; j++) {
          const t = rand(0.28, 0.78);
          const p = pointOnQuadratic(p0, cp, p1, t);
          leaves.push({
            x: p.x,
            y: p.y,
            side: j % 2 === 0 ? -1 : 1,
            size: rand(10, 16),
            angle: rand(-0.35, 0.35),
            appearAt: start + rand(0.35, duration * 0.82)
          });
        }

        stems.push({ p0, cp, p1, width, start, duration, leaves });
        tipPoints.push({ x: p1.x, y: p1.y, start, duration });
      }

      // Filler stems inside bouquet for density.
      const fillerCount = portrait ? 5 : 6;
      for (let i = 0; i < fillerCount; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const baseX = centerX + rand(-bouquetWidth * 0.22, bouquetWidth * 0.22);
        const height = H * rand(0.16, 0.24);
        const tipX = centerX + side * rand(W * 0.03, W * 0.08);
        const tipY = H - height;
        const p0 = { x: baseX, y: baseY };
        const cp = {
          x: baseX + side * rand(12, 28),
          y: H - height * rand(0.42, 0.58)
        };
        const p1 = { x: tipX, y: tipY };
        const start = rand(0.6, 5.2);
        const duration = rand(1.8, 2.9);

        stems.push({
          p0, cp, p1,
          width: rand(1.6, 2.3),
          start,
          duration,
          leaves: []
        });
      }

      tipPoints.sort((a, b) => a.x - b.x);

      tipPoints.forEach((tip, i) => {
        flowers.push({
          x: tip.x,
          y: tip.y,
          size: rand(18, 27), // bigger flowers
          color: flowerColors[i % flowerColors.length],
          type: flowerTypes[i % flowerTypes.length],
          rotation: rand(-Math.PI, Math.PI),
          bloomAt: tip.start + tip.duration - 0.15 + rand(0.05, 0.28) // bloom right after stem grows
        });
      });

      for (let i = 0; i < 18; i++) {
        particles.push({
          x: rand(0, W),
          y: rand(0, H),
          r: rand(0.4, 1.1),
          drift: rand(0.03, 0.08),
          phase: rand(0, Math.PI * 2)
        });
      }
    }

    function drawStem(stem, progress) {
      if (progress <= 0) return;
      const steps = 36;
      const count = Math.max(1, Math.floor(steps * progress));
      ctx.beginPath();
      ctx.moveTo(stem.p0.x, stem.p0.y);
      for (let i = 1; i <= count; i++) {
        const t = i / steps;
        const p = pointOnQuadratic(stem.p0, stem.cp, stem.p1, t);
        ctx.lineTo(p.x, p.y);
      }

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(7,24,13,0.28)';
      ctx.lineWidth = stem.width + 2.1;
      ctx.stroke();

      ctx.strokeStyle = '#1d3f27';
      ctx.lineWidth = stem.width;
      ctx.stroke();
    }

    function drawLeaf(leaf, alpha) {
      ctx.save();
      ctx.translate(leaf.x, leaf.y);
      ctx.rotate(leaf.angle + (leaf.side === -1 ? -0.90 : 0.90));
      const s = leaf.size;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.50, -s * 0.52, 0, -s * 1.02);
      ctx.quadraticCurveTo(-s * 0.50, -s * 0.52, 0, 0);
      ctx.fillStyle = hexToRgba('#2d5635', alpha);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -s * 0.92);
      ctx.strokeStyle = hexToRgba('#456f4a', alpha * 0.65);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawDaisy(s, color, alpha) {
      for (let i = 0; i < 8; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 / 8) * i);
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.68, s * 0.24, s * 0.66, 0, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(color, alpha);
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.20, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba('#e0d1a4', alpha);
      ctx.fill();
    }

    function drawSimple5(s, color, alpha) {
      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 / 5) * i);
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.54, s * 0.34, s * 0.60, 0, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(color, alpha);
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.16, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba('#efe4d3', alpha);
      ctx.fill();
    }

    function drawCup(s, color, alpha) {
      ctx.beginPath();
      ctx.moveTo(-s * 0.86, s * 0.32);
      ctx.quadraticCurveTo(-s * 0.74, -s * 0.52, -s * 0.20, -s * 0.76);
      ctx.quadraticCurveTo(0, -s * 0.30, s * 0.20, -s * 0.76);
      ctx.quadraticCurveTo(s * 0.74, -s * 0.52, s * 0.86, s * 0.32);
      ctx.quadraticCurveTo(0, s * 0.82, -s * 0.86, s * 0.32);
      ctx.fillStyle = hexToRgba(color, alpha);
      ctx.fill();
    }

    function drawRose(s, color, alpha) {
      ctx.fillStyle = hexToRgba(color, alpha);
      for (let i = 0; i < 7; i++) {
        ctx.save();
        ctx.rotate(i * 0.55);
        ctx.beginPath();
        ctx.ellipse(0, -s * (0.14 + i * 0.035), s * (0.30 + i * 0.018), s * (0.20 + i * 0.02), 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(color, alpha * 0.9);
      ctx.fill();
    }

    function drawFlower(flower, scale, alpha) {
      ctx.save();
      ctx.translate(flower.x, flower.y);
      ctx.rotate(flower.rotation);
      const s = flower.size * scale;

      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.9);
      glow.addColorStop(0, hexToRgba(flower.color, 0.10 * alpha));
      glow.addColorStop(1, hexToRgba(flower.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, s * 1.9, 0, Math.PI * 2);
      ctx.fill();

      if (flower.type === 'rose') drawRose(s, flower.color, alpha);
      else if (flower.type === 'daisy') drawDaisy(s, flower.color, alpha);
      else if (flower.type === 'cup') drawCup(s, flower.color, alpha);
      else drawSimple5(s, flower.color, alpha);

      ctx.restore();
    }

    function drawParticles(t) {
      const fade = clamp((t - 4) / 5, 0, 1);
      if (fade <= 0) return;
      particles.forEach(p => {
        const y = (p.y - t * p.drift * 14 + H) % H;
        const x = p.x + Math.sin(t * 0.45 + p.phase) * 3;
        const a = (0.03 + 0.05 * Math.sin(t + p.phase)) * fade;
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, a)})`;
        ctx.beginPath();
        ctx.arc(x, y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function render(now) {
      const t = (now - startTime) / 1000;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      drawParticles(t);

      stems.forEach(stem => {
        const p = easeOutCubic((t - stem.start) / stem.duration);
        drawStem(stem, p);
        stem.leaves.forEach(leaf => {
          const lp = easeOutBack((t - leaf.appearAt) / 0.55);
          if (lp > 0) drawLeaf(leaf, clamp(lp, 0, 1));
        });
      });

      flowers.forEach(flower => {
        const p = easeOutBack((t - flower.bloomAt) / 0.72);
        if (p > 0) {
          drawFlower(
            flower,
            clamp(p, 0, 1.15),
            clamp((t - flower.bloomAt) / 0.35, 0, 1)
          );
        }
      });

      requestAnimationFrame(render);
    }

    function replay() {
      startTime = performance.now();
      hint.style.animation = 'none';
      hint.offsetHeight;
      hint.style.animation = '';
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', replay);

    resize();

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      startTime = performance.now() - 14000;
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
