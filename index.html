<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Bouquet Bloom</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{touch-action:manipulation;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#000}
    .hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px;letter-spacing:.1em;opacity:0;animation:hint .8s ease 13s forwards;white-space:nowrap;pointer-events:none}@keyframes hint{to{opacity:1}}
  </style>
</head>
<body>
<canvas id="scene"></canvas><div class="hint">tap to replay</div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),hint=document.querySelector('.hint');
let W=0,H=0,DPR=1,startTime=performance.now(),stems=[],flowers=[],dust=[];
function rng(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let r=rng(20260820);const rand=(a,b)=>a+(b-a)*r(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ease(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3)}
function bloomEase(t){t=clamp(t,0,1);const c1=1.45,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function q(p0,c,p1,t){const u=1-t;return{x:u*u*p0.x+2*u*t*c.x+t*t*p1.x,y:u*u*p0.y+2*u*t*c.y+t*t*p1.y}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);build()}
function build(){stems=[];flowers=[];dust=[];r=rng(20260820);const cx=W*.5,baseY=H*1.03,count=9;
 const colors=['#963f43','#eee9df','#c887a3','#c4aa4f']; const types=['rose','daisy','cup','five'];
 for(let i=0;i<count;i++){
   const n=i/(count-1)-.5,baseX=cx+n*W*.13+rand(-5,5),height=H*rand(.34,.49);
   const p0={x:baseX,y:baseY},p1={x:cx+n*W*.38+rand(-18,18),y:H-height};
   const c={x:cx+n*W*rand(.13,.25)+rand(-35,35),y:H-height*rand(.45,.64)};
   const start=.25+i*.48+rand(-.15,.15),duration=2.8+rand(0,1.25),width=rand(2.2,4.0),leaves=[];
   for(let j=0;j<2+(i%2);j++){const t=rand(.34,.78),p=q(p0,c,p1,t);leaves.push({x:p.x,y:p.y,side:j%2?-1:1,size:rand(10,16),at:start+duration*t*.86,angle:rand(-.28,.28)})}
   stems.push({p0,c,p1,start,duration,width,leaves});
   flowers.push({x:p1.x,y:p1.y,size:rand(12,17),color:colors[i%4],type:types[i%4],rot:rand(-Math.PI,Math.PI),bloomAt:start+duration+rand(.08,.24)});
 }
 for(let i=0;i<18;i++)dust.push({x:rand(0,W),y:rand(0,H),r:rand(.35,1),ph:rand(0,6.28)});
}
function drawStem(s,p){if(p<=0)return;ctx.beginPath();ctx.moveTo(s.p0.x,s.p0.y);for(let i=1;i<=36*p;i++){let t=i/36,pt=q(s.p0,s.c,s.p1,t);ctx.lineTo(pt.x,pt.y)}ctx.lineCap='round';ctx.strokeStyle='#1d3c27';ctx.lineWidth=s.width;ctx.stroke()}
function leaf(l,a){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.angle+(l.side>0?.9:-.9));let s=l.size;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.5,-s*.55,0,-s);ctx.quadraticCurveTo(-s*.5,-s*.55,0,0);ctx.fillStyle=rgba('#2d5536',a);ctx.fill();ctx.restore()}
function petals(n,s,color,a,rx=.28,ry=.58){for(let i=0;i<n;i++){ctx.save();ctx.rotate(i*Math.PI*2/n);ctx.beginPath();ctx.ellipse(0,-s*.55,s*rx,s*ry,0,0,Math.PI*2);ctx.fillStyle=rgba(color,a);ctx.fill();ctx.restore()}}
function flower(f,scale,a){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);let s=f.size*scale;
 const g=ctx.createRadialGradient(0,0,0,0,0,s*2);g.addColorStop(0,rgba(f.color,.1*a));g.addColorStop(1,rgba(f.color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*2,0,Math.PI*2);ctx.fill();
 if(f.type==='daisy'){petals(8,s,f.color,a,.22,.6);ctx.beginPath();ctx.arc(0,0,s*.2,0,6.28);ctx.fillStyle=rgba('#ddc98f',a);ctx.fill()}
 else if(f.type==='five'){petals(5,s,f.color,a,.32,.56);ctx.beginPath();ctx.arc(0,0,s*.14,0,6.28);ctx.fillStyle=rgba('#eee4d4',a);ctx.fill()}
 else if(f.type==='cup'){ctx.beginPath();ctx.moveTo(-s*.8,s*.32);ctx.quadraticCurveTo(-s*.68,-s*.5,-s*.2,-s*.72);ctx.quadraticCurveTo(0,-s*.28,s*.2,-s*.72);ctx.quadraticCurveTo(s*.68,-s*.5,s*.8,s*.32);ctx.quadraticCurveTo(0,s*.78,-s*.8,s*.32);ctx.fillStyle=rgba(f.color,a);ctx.fill()}
 else{for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*.72);ctx.beginPath();ctx.ellipse(0,-s*(.17+i*.025),s*(.28+i*.012),s*(.2+i*.014),.45,0,6.28);ctx.fillStyle=rgba(f.color,a*.92);ctx.fill();ctx.restore()}ctx.beginPath();ctx.arc(0,0,s*.2,0,6.28);ctx.fillStyle=rgba(f.color,a);ctx.fill()}
 ctx.restore()}
function render(now){let t=(now-startTime)/1000;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 dust.forEach(d=>{let a=.025+.03*Math.sin(t+d.ph);ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(d.x+Math.sin(t*.35+d.ph)*3,d.y,d.r,0,6.28);ctx.fill()});
 stems.forEach(s=>{let p=ease((t-s.start)/s.duration);drawStem(s,p);s.leaves.forEach(l=>{let lp=bloomEase((t-l.at)/.55);if(lp>0)leaf(l,clamp(lp,0,1))})});
 flowers.forEach(f=>{let p=bloomEase((t-f.bloomAt)/.8);if(p>0)flower(f,clamp(p,0,1.12),clamp((t-f.bloomAt)/.4,0,1))});
 requestAnimationFrame(render)}
function replay(){startTime=performance.now();hint.style.animation='none';hint.offsetHeight;hint.style.animation=''}
canvas.addEventListener('pointerdown',replay);addEventListener('resize',resize);resize();requestAnimationFrame(render);
</script>
</body></html>
